[SPHN]
sphn_rdf_schema_file_path = "sphn_schema_release_2026.1.ttl" # Please change the path to the SPHN RDF schema file for the 2026.1 release

[SPHN.data_provider] 
category = "University" # Mustbe a sphn:DataProvider_category valueset member

[SPHN.data_provider.department] 
name = "Department of Medical Imaging Benders"

[SPHN.data_provider.institution_code]
coding_system_and_version = "UID" # The coding system and version of the identifier, e.g. "UID"
identifier = "CHE_888_888_888" # The Enterprise Identification Number UID.
name = "University of Switzerland"

[SPHN.source_system] 
name = "Medical image management system"
purpose = "Research" # Must be a sphn:SourceSystem_purpose valueset member
category = "HealthcareInformationSystem" # Must be a sphn:SourceSystem_category valueset member

[SPHN.source_system.healthcare_primary_information_system]
name = "Medical image management system"

[SPHN.source_system.healthcare_primary_information_system.code]
coding_system_and_version = "SNOMED"
identifier = "702183004" # Meaning: SNOMED CT: 702183004 | Medical image management system (physical object) |
name = "Medical image management system (physical object)"

[orthanc_rest_api_user]
base_url = "http://localhost:8042"      # Orthanc REST API base URL, e.g.: "http://localhost:8042" or "http://1.2.3.4:8042"
username = "orthanc_user"               # Orthanc REST API username
password = "orthanc_password"           # Orthanc REST API password

[dicomweb_api_user]
base_url = "http://localhost/dicom-web:8042" # DICOMweb API base URL, e.g.: "http://localhost/dicom-web:8042" or "http://1.2.3.4/dicom-web:8042"
username = "dicomweb_user"                   # DICOMweb API username
password = "dicomweb_password"               # DICOMweb API password
timeout_seconds = 300                        # Timeout for DICOMweb API requests in seconds (default and minimum is 20 seconds)

[database_api_user]
base_url = "http://localhost:5432" # Database base URL, e.g.: "http://localhost:5432" or "http://1.2.3.4:5432"
username = "database_user"         # Database username
password = "database_password"     # Database password

[dicom_options]
# List of allowed SOP Class UIDs (of type Storage Service Class) and their meanings
allowed_sop_classes = [
    { UID = "1.2.840.10008.5.1.4.1.1.2",        Meaning = "CT Image Storage" },
    { UID = "1.2.840.10008.5.1.4.1.1.4",        Meaning = "MR Image Storage" },
    { UID = "1.2.840.10008.5.1.4.1.1.128",      Meaning = "Positron Emission Tomography Image Storage" }
]

#    { UID = "1.2.840.10008.5.1.4.1.1.1",        Meaning = "Computed Radiography Image Storage" },
#    { UID = "1.2.840.10008.5.1.4.1.1.77.1.6",   Meaning = "VL Whole Slide Microscopy Image Storage" },

# Timezone of the DICOM dates and times (IANA name, see https://en.wikipedia.org/wiki/List_of_tz_database_time_zones).
# DICOM dates and times are local times. This timezone (including daylight saving time) is used,
# unless the DICOM dataset contains a TimezoneOffsetFromUTC (0008,0201) tag:
local_timezone = "Europe/Zurich"

# Set a DICOM StudyDate and StudyTime for DICOM Studies without a date/time (these placeholder datetimes are in UTC):
fallback_study_date = "1800-01-01" # "YYYY-MM-DD"
fallback_study_time = "12:00:00"   # "HH:MM:SS"

# Set a DICOM Contrast Agent Administration Date and Time for DICOM Studies without a date/time:
fallback_contrast_agent_date = "1800-01-01" # "YYYY-MM-DD"
fallback_contrast_agent_time = "12:00:00"   # "HH:MM:SS"

[data_processing]
# DICOM series may contain multiple image frames (2D slices) and the metadata of each frame is stored in a corresponding 
# SPHN Imaging Frame object. Therefore, a corresponding amount of SPHN Imaging Frame objects will be created.
# However, as the metadata is often the same for all frames within a series, this may lead to redundant information 
# being stored across multiple SPHN Imaging Frame objects. This redundancy can be avoided by storing only 
# unique SPHN Imaging Frame objects in each series. 
# The same applies to SPHN Imaging Series and SPHN Imaging Procedure objects, where redundant information can be 
# avoided by storing only unique objects. 
# Note that the number of frames in a series and/or the number of series in a procedure and/or the number of procedures
# a patient undergoes can then no longer be deduced by counting the stored SPHN Imaging objects.
#
# Set to true to add only unique SPHN Imaging Procedure, Series, and Frame objects.
add_only_unique_sphn_imaging_procedures = false
add_only_unique_sphn_imaging_series = false
add_only_unique_sphn_imaging_frames = true
